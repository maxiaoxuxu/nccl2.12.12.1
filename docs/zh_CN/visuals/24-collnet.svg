<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="880" viewBox="0 0 1040 880" role="img" aria-label="CollNet：机内分片归约，网络插件归约，再机内收齐"><title>CollNet：机内分片归约，网络插件归约，再机内收齐</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="880" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">CollNet：机内分片归约，网络插件归约，再机内收齐</text><rect x="76.0" y="85" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="291.0" y="136.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">节点 A：GPU 输入</text><rect x="534.0" y="85" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="749.0" y="136.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">节点 B：GPU 输入</text><rect x="76.0" y="235" width="430" height="90" rx="9" fill="#fff5df" stroke="#c7d1df"/><text x="291.0" y="274.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">A 的多个 head</text><text x="291.0" y="298.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">分别归约不同片段</text><rect x="534.0" y="235" width="430" height="90" rx="9" fill="#fff5df" stroke="#c7d1df"/><text x="749.0" y="274.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">B 的多个 head</text><text x="749.0" y="298.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">分别归约不同片段</text><rect x="305.0" y="385" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="520.0" y="424.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">相同 head 分片的网络 Iallreduce</text><text x="520.0" y="448.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">需要插件/硬件支持</text><rect x="76.0" y="535" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="291.0" y="586.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">A head 收到各片结果</text><rect x="534.0" y="535" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="749.0" y="586.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">B head 收到各片结果</text><rect x="305.0" y="685" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="724.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">机内 Broadcast + Gather</text><text x="520.0" y="748.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">每个 GPU 收齐完整输出</text><path d="M291.0 175 L291.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><text x="298.0" y="196.0" font-size="17" fill="#172439" text-anchor="start" font-weight="400">Scatter</text><path d="M749.0 175 L749.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><text x="756.0" y="196.0" font-size="17" fill="#172439" text-anchor="start" font-weight="400">Scatter</text><path d="M291.0 325 L520.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M749.0 325 L520.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 475 L291.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 475 L749.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M291.0 625 L520.0 685" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M749.0 625 L520.0 685" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/></svg>