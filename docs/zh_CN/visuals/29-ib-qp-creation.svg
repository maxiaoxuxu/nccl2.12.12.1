<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="890" viewBox="0 0 1040 890" role="img"><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#172d43}</style><title>IB数据QP创建：双方建链与接收侧可选flush资源</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536b83"/></marker></defs><rect width="1040" height="100%" fill="#fff"/><text x="28" y="40" font-size="25" font-weight="600">IB数据QP创建：双方建链与接收侧可选flush资源</text><rect x="50" y="85" width="435" height="80" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="267.5" y="119.0" text-anchor="middle" font-size="19">发送侧 ncclIbConnect</text><text x="267.5" y="145.0" text-anchor="middle" font-size="19">分阶段推进，sendComm可暂为空</text><rect x="555" y="85" width="435" height="80" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="772.5" y="119.0" text-anchor="middle" font-size="19">接收侧 ncclIbAccept</text><text x="772.5" y="145.0" text-anchor="middle" font-size="19">分阶段推进，recvComm可暂为空</text><rect x="50" y="230" width="435" height="85" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="267.5" y="266.5" text-anchor="middle" font-size="19">循环q次：ncclIbCreateQp</text><text x="267.5" y="292.5" text-anchor="middle" font-size="19">RC QP创建并转INIT；持有本对象CQ</text><rect x="555" y="230" width="435" height="85" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="772.5" y="266.5" text-anchor="middle" font-size="19">循环q次：ncclIbCreateQp</text><text x="772.5" y="292.5" text-anchor="middle" font-size="19">RC QP创建并转INIT；持有本对象CQ</text><polyline points="267,165 267,230" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><polyline points="772,165 772,230" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="390" width="540" height="90" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="520.0" y="429.0" text-anchor="middle" font-size="19">通过建链socket交换QPN、MTU、地址</text><text x="520.0" y="455.0" text-anchor="middle" font-size="19">对应QP配对；不是GPU用户张量传输</text><polyline points="267,315 267,352 520,352 520,390" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><polyline points="772,315 772,352 520,352 520,390" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="545" width="540" height="80" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="520.0" y="579.0" text-anchor="middle" font-size="19">ncclIbRtrQp → ncclIbRtsQp</text><text x="520.0" y="605.0" text-anchor="middle" font-size="19">经ready握手后可用于后续数据请求</text><polyline points="520,480 520,545" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="710" width="460" height="115" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="270.0" y="748.5" text-anchor="middle" font-size="19">发送/接收控制FIFO各自注册MR</text><text x="270.0" y="774.5" text-anchor="middle" font-size="19">数据缓冲由NET层另行regMr</text><text x="270.0" y="800.5" text-anchor="middle" font-size="19">多个数据QP可使用同一缓冲MR</text><rect x="540" y="710" width="460" height="115" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="770.0" y="748.5" text-anchor="middle" font-size="19">接收侧满足gpuFlush.enabled时</text><text x="770.0" y="774.5" text-anchor="middle" font-size="19">额外1个自连接QP + 1个host MR</text><text x="770.0" y="800.5" text-anchor="middle" font-size="19">该附加QP数不乘q</text><polyline points="520,625 520,665 270,665 270,710" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><polyline points="520,625 520,665 770,665 770,710" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/></svg>
