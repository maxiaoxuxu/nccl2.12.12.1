<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="850" viewBox="0 0 1040 850" role="img" aria-label="同一消息的三层划分：地址范围、原语片段、循环进度"><title>同一消息的三层划分：地址范围、原语片段、循环进度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="850" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">同一消息的三层划分：地址范围、原语片段、循环进度</text><rect x="305.0" y="85" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="136.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">用户张量：N 个 T 元素</text><rect x="305.0" y="235" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="274.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">C 个 channel 并行分工</text><text x="520.0" y="298.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">每 channel 含 P 个 Ring 逻辑块</text><rect x="305.0" y="385" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="436.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">一个算法块：realChunkSize 个元素</text><rect x="76.0" y="535" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="291.0" y="574.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">slice 0</text><text x="291.0" y="598.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">有效元素范围</text><rect x="534.0" y="535" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="749.0" y="574.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">slice 1</text><text x="749.0" y="598.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">有效元素范围</text><rect x="305.0" y="685" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="724.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">每个 slice 推进 StepPerSlice</text><text x="520.0" y="748.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">step % 8 决定物理槽，大小不等于有效载荷</text><path d="M520.0 175 L520.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 325 L520.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><text x="527.0" y="346.0" font-size="17" fill="#172439" text-anchor="start" font-weight="400">按 bid / chunk 算偏移</text><path d="M520.0 475 L291.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 475 L749.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M291.0 625 L520.0 685" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M749.0 625 L520.0 685" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/></svg>