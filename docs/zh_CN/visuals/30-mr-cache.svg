<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="940" viewBox="0 0 1040 940" role="img"><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#172d43}</style><title>数据MR缓存：按页范围精确命中与引用释放</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536b83"/></marker></defs><rect width="1040" height="100%" fill="#fff"/><text x="28" y="40" font-size="25" font-weight="600">数据MR缓存：按页范围精确命中与引用释放</text><rect x="250" y="85" width="540" height="85" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="520.0" y="121.5" text-anchor="middle" font-size="19">ncclIbRegMr(data, size)</text><text x="520.0" y="147.5" text-anchor="middle" font-size="19">页对齐起址addr，计算覆盖页数pages</text><rect x="250" y="230" width="540" height="85" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="520.0" y="266.5" text-anchor="middle" font-size="19">锁住本进程IB设备的mrCache</text><text x="520.0" y="292.5" text-anchor="middle" font-size="19">查找addr和pages均相同的条目</text><polyline points="520,170 520,230" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="395" width="450" height="85" rx="10" fill="#e7f5ee" stroke="#b9cce0"/><text x="265.0" y="431.5" text-anchor="middle" font-size="19">精确命中：refs++</text><text x="265.0" y="457.5" text-anchor="middle" font-size="19">返回已有ibv_mr，不重新注册</text><rect x="550" y="395" width="450" height="85" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="775.0" y="431.5" text-anchor="middle" font-size="19">未命中：reg_mr / reg_mr_iova2</text><text x="775.0" y="457.5" text-anchor="middle" font-size="19">新增条目，refs=1</text><polyline points="520,315 520,350 265,350 265,395" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><text x="280" y="340" font-size="17">命中</text><polyline points="520,315 520,350 775,350 775,395" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><text x="790" y="340" font-size="17">未命中</text><rect x="250" y="555" width="540" height="85" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="520.0" y="591.5" text-anchor="middle" font-size="19">mhandle供连接/数据请求复用</text><text x="520.0" y="617.5" text-anchor="middle" font-size="19">本地lkey；向远端公布目标rkey</text><polyline points="265,480 265,515 520,515 520,555" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><polyline points="775,480 775,515 520,515 520,555" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="710" width="540" height="90" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="520.0" y="749.0" text-anchor="middle" font-size="19">ncclIbDeregMr：refs--</text><text x="520.0" y="775.0" text-anchor="middle" font-size="19">仅refs归零才删除条目并真正注销</text><polyline points="520,640 520,710" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="845" width="780" height="65" rx="10" fill="#fff3df" stroke="#b9cce0"/><text x="520.0" y="884.5" text-anchor="middle" font-size="19">范围包含不等于命中；控制FIFO和flush MR未经过本缓存</text></svg>
