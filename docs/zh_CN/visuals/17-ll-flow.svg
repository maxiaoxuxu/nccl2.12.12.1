<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1030" viewBox="0 0 1040 1030" role="img" aria-label="LLGenericOp：行 flag 就绪后才归约和转发"><title>LLGenericOp：行 flag 就绪后才归约和转发</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="1030" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">LLGenericOp：行 flag 就绪后才归约和转发</text><rect x="305.0" y="85" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="124.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">SEND 时先 waitSend</text><text x="520.0" y="148.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">为 cleanup 预留空间，即使 nelem=0</text><rect x="305.0" y="235" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="286.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">提前加载本地输入；预读其他接收行</text><rect x="305.0" y="385" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="436.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">readLL：flag1、flag2 都等于期望序号？</text><rect x="305.0" y="535" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="574.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">取出 8 B 数据；合并本地 / 其他邻居</text><text x="520.0" y="598.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">本地原始 input 执行一次 preOp</text><rect x="305.0" y="685" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="724.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">可选 postOp → storeLL 数据+flag</text><text x="520.0" y="748.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">需要本地结果时 storeData</text><rect x="305.0" y="835" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="874.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">推进邻居 step；postRecv 释放空间</text><text x="520.0" y="898.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">标记回绕轮 incSend 执行清理</text><path d="M520.0 175 L520.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 325 L520.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 475 L520.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><text x="527.0" y="496.0" font-size="17" fill="#172439" text-anchor="start" font-weight="400">就绪</text><path d="M520.0 625 L520.0 685" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 775 L520.0 835" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="735.0,415.0 805.0,415.0 805.0,445.0 735.0,445.0" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><text x="810.0" y="436.0" font-size="17" fill="#172439" text-anchor="start" font-weight="400">未就绪且未中止</text></svg>