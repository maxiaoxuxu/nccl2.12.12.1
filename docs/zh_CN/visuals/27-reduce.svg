<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" role="img" aria-label="Reduce root=0：从 root 后继起步，归约到 root 停止"><title>Reduce root=0：从 root 后继起步，归约到 root 停止</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="740" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">Reduce root=0：从 root 后继起步，归约到 root 停止</text><rect x="305.0" y="85" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="520.0" y="136.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">rank1：send X1</text><rect x="305.0" y="235" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="520.0" y="286.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">rank2：recvReduceSend X1+X2</text><rect x="305.0" y="385" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="520.0" y="436.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">rank3：recvReduceSend X1+X2+X3</text><rect x="305.0" y="535" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="520.0" y="574.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">rank0 root：recvReduceCopy</text><text x="520.0" y="598.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">加 X0 并保留最终结果</text><path d="M520.0 175 L520.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 325 L520.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 475 L520.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/></svg>