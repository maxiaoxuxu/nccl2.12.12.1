<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="860" viewBox="0 0 1040 860" role="img"><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#172d43}</style><title>Channel生成：硬件候选图、全局拼接与每次操作选择</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536b83"/></marker></defs><rect width="1040" height="100%" fill="#fff"/><text x="28" y="40" font-size="25" font-weight="600">Channel生成：硬件候选图、全局拼接与每次操作选择</text><rect x="250" y="80" width="540" height="78" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="520.0" y="113.0" text-anchor="middle" font-size="19">硬件发现与路径分析</text><text x="520.0" y="139.0" text-anchor="middle" font-size="19">ncclTopoGetSystem / ComputePaths</text><rect x="40" y="235" width="310" height="85" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="195.0" y="271.5" text-anchor="middle" font-size="19">Ring候选</text><text x="195.0" y="297.5" text-anchor="middle" font-size="19">MAXCHANNELS/2起始上限</text><polyline points="520,158 520,195 195,195 195,235" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><polyline points="195,320 195,358 520,358 520,395" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><rect x="365" y="235" width="310" height="85" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="520.0" y="271.5" text-anchor="middle" font-size="19">Tree候选</text><text x="520.0" y="297.5" text-anchor="middle" font-size="19">BALANCED_TREE</text><polyline points="520,158 520,195 520,195 520,235" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><polyline points="520,320 520,358 520,358 520,395" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><rect x="690" y="235" width="310" height="85" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="845.0" y="271.5" text-anchor="middle" font-size="19">CollNet候选</text><text x="845.0" y="297.5" text-anchor="middle" font-size="19">支持时另行搜索</text><polyline points="520,158 520,195 845,195 845,235" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><polyline points="845,320 845,358 520,358 520,395" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="395" width="540" height="90" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="520.0" y="434.0" text-anchor="middle" font-size="19">Bootstrap交换 + TopoPreset/Postset</text><text x="520.0" y="460.0" text-anchor="middle" font-size="19">协调通道数、拼接全局Ring/Tree邻居</text><rect x="250" y="550" width="540" height="90" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="520.0" y="589.0" text-anchor="middle" font-size="19">initChannel / setupChannel / transport建链</text><text x="520.0" y="615.0" text-anchor="middle" font-size="19">保存ring.index、userRanks；设备视图随后复制</text><polyline points="520,485 520,550" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="715" width="455" height="90" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="267.5" y="754.0" text-anchor="middle" font-size="19">P2P通道编号空间与每peer预算</text><text x="267.5" y="780.0" text-anchor="middle" font-size="19">ncclTopoComputeP2pChannels</text><rect x="545" y="715" width="455" height="90" rx="10" fill="#edf4ff" stroke="#b9cce0"/><text x="772.5" y="754.0" text-anchor="middle" font-size="19">每次操作再选算法/协议/通道子集</text><text x="772.5" y="780.0" text-anchor="middle" font-size="19">getAlgoInfo → computeColl → bid</text><polyline points="520,640 520,678 267,678 267,715" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/><polyline points="520,640 520,678 772,678 772,715" fill="none" stroke="#536b83" stroke-width="2" marker-end="url(#a)"/></svg>
