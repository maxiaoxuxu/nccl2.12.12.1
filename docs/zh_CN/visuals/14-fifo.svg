<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="8 槽数据 FIFO：进度单调增加，槽位循环复用"><title>8 槽数据 FIFO：进度单调增加，槽位循环复用</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="440" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">8 槽数据 FIFO：进度单调增加，槽位循环复用</text><rect x="45" y="95" width="225" height="70" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="157.5" y="124.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">槽 0</text><text x="157.5" y="147.76999999999998" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">绝对 step % 8 = 0</text><rect x="295" y="95" width="225" height="70" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="407.5" y="124.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">槽 1</text><text x="407.5" y="147.76999999999998" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">绝对 step % 8 = 1</text><rect x="545" y="95" width="225" height="70" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="657.5" y="124.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">槽 2</text><text x="657.5" y="147.76999999999998" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">绝对 step % 8 = 2</text><rect x="795" y="95" width="225" height="70" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="907.5" y="124.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">槽 3</text><text x="907.5" y="147.76999999999998" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">绝对 step % 8 = 3</text><rect x="45" y="190" width="225" height="70" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="157.5" y="219.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">槽 4</text><text x="157.5" y="242.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">绝对 step % 8 = 4</text><rect x="295" y="190" width="225" height="70" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="407.5" y="219.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">槽 5</text><text x="407.5" y="242.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">绝对 step % 8 = 5</text><rect x="545" y="190" width="225" height="70" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="657.5" y="219.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">槽 6</text><text x="657.5" y="242.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">绝对 step % 8 = 6</text><rect x="795" y="190" width="225" height="70" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="907.5" y="219.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">槽 7</text><text x="907.5" y="242.77" font-size="19" fill="#172439" text-anchor="middle" font-weight="400">绝对 step % 8 = 7</text><text x="45" y="340" font-size="20" fill="#172439" text-anchor="start" font-weight="400">例：head=6，欲完成到 step=16；6+8&lt;16，生产者必须等待。</text><text x="45" y="383" font-size="20" fill="#172439" text-anchor="start" font-weight="400">head 变为 8 后：8+8=16，可使用下一轮槽；不是全部 rank 屏障。</text></svg>