<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1030" viewBox="0 0 1040 1030" role="img" aria-label="NET 接收：网络完成 ≠ GPU 已消费"><title>NET 接收：网络完成 ≠ GPU 已消费</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="1030" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">NET 接收：网络完成 ≠ GPU 已消费</text><rect x="305.0" y="85" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="520.0" y="136.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">Irecv 挂目标缓冲；posted 前进</text><rect x="305.0" y="235" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="520.0" y="286.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">Test：received 前进</text><rect x="305.0" y="385" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="424.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">Simple + GDR + 有效数据时</text><text x="520.0" y="448.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">必要的 Iflush / GDRCopy flush</text><rect x="305.0" y="535" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="574.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">flush 完成后发布 tail</text><text x="520.0" y="598.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">transmitted 前进</text><rect x="305.0" y="685" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="520.0" y="724.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">GPU 等待满足 → 读取/归约</text><text x="520.0" y="748.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">消费后写 head</text><rect x="305.0" y="835" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="874.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">Proxy 观察 head：done 前进</text><text x="520.0" y="898.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">达到 nsteps 才结束 sub</text><path d="M520.0 175 L520.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 325 L520.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 475 L520.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 625 L520.0 685" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 775 L520.0 835" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/></svg>