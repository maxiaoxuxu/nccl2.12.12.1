<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1030" viewBox="0 0 1040 1030" role="img" aria-label="Send/Recv：Group 先分 channel，设备再分协议块"><title>Send/Recv：Group 先分 channel，设备再分协议块</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="1030" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">Send/Recv：Group 先分 channel，设备再分协议块</text><rect x="305.0" y="85" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="136.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">保存 peer、用户缓冲、字节数</text><rect x="305.0" y="235" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="286.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">GroupEnd：按消息量与 per-peer 预算分块</text><rect x="305.0" y="385" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="436.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">chunk 号 % perPeer → channel 映射</text><rect x="305.0" y="535" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="574.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">P2P work 内分收/发线程组</text><text x="520.0" y="598.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">普通路径使用连接索引 1</text><rect x="305.0" y="685" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="736.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">runSend / runRecv 内按 chunkSize 循环</text><rect x="305.0" y="835" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="874.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">Simple 原语推进</text><text x="520.0" y="898.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">self peer 配对后本地复制</text><path d="M520.0 175 L520.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 325 L520.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 475 L520.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 625 L520.0 685" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 775 L520.0 835" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/></svg>