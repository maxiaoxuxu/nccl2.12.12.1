<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1030" viewBox="0 0 1040 1030" role="img" aria-label="LL128：warp 协作检查行尾 flag，并与寄存器加载重叠"><title>LL128：warp 协作检查行尾 flag，并与寄存器加载重叠</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="1030" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">LL128：warp 协作检查行尾 flag，并与寄存器加载重叠</text><rect x="305.0" y="85" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="136.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">waitSend → 线程组 barrier</text><rect x="305.0" y="235" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="286.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">loadRegsBegin 提前取本地数据</text><rect x="305.0" y="385" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="424.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">接收 load128；flagThread 检查序号</text><text x="520.0" y="448.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">any_sync：任一标记不符就继续重读</text><rect x="305.0" y="535" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="574.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">loadRegsFinish 重排寄存器</text><text x="520.0" y="598.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">preOp → 多源归约 → 可选 postOp</text><rect x="305.0" y="685" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="724.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">下游：store128 携带行尾 flag</text><text x="520.0" y="748.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">本地：storeRegs 还原用户布局</text><rect x="305.0" y="835" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="874.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">barrier → 推进 step → postSend / postRec</text><text x="520.0" y="898.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">v</text><path d="M520.0 175 L520.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 325 L520.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 475 L520.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><text x="527.0" y="496.0" font-size="17" fill="#172439" text-anchor="start" font-weight="400">全部行就绪</text><path d="M520.0 625 L520.0 685" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 775 L520.0 835" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/></svg>