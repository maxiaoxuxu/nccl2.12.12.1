<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1170" viewBox="0 0 1040 1170" role="img" aria-label="Simple genericOp：非空 worker 与其余线程的匹配屏障"><title>Simple genericOp：非空 worker 与其余线程的匹配屏障</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="1170" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">Simple genericOp：非空 worker 与其余线程的匹配屏障</text><rect x="305.0" y="85" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="136.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">nelem 归零下限；计算 sliceSize；slice=0</text><rect x="76.0" y="235" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="291.0" y="286.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">worker 且仍有有效元素</text><rect x="534.0" y="235" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="749.0" y="286.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">非 worker / 剩余空 slice</text><rect x="76.0" y="385" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="291.0" y="436.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">设 srcs/dsts → waitPeer → subBarrier</text><rect x="534.0" y="385" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="749.0" y="424.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">空 slice 调 waitPeer(0)</text><text x="749.0" y="448.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">同步线程不执行数据复制</text><rect x="76.0" y="535" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="291.0" y="586.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">ReduceOrCopyMulti 或 direct 特例</text><rect x="534.0" y="535" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="749.0" y="586.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">保持与 worker 同次屏障</text><rect x="305.0" y="685" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="736.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">barrier：两条路径在这里配对</text><rect x="305.0" y="835" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="886.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">发送发布线程 fence → syncwarp → postPeer</text><rect x="305.0" y="985" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="1024.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">推进 offset / slice；不足片数继续</text><text x="520.0" y="1048.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">退出前必须完成相应协议片数</text><path d="M520.0 175 L291.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 175 L749.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M291.0 325 L291.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M749.0 325 L749.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M291.0 475 L291.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M749.0 475 L749.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M291.0 625 L520.0 685" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M749.0 625 L520.0 685" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 775 L520.0 835" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 925 L520.0 985" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/></svg>