<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-label="同一 slice 的 step：两个角色各自从 0 推进到 2"><title>同一 slice 的 step：两个角色各自从 0 推进到 2</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="450" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">同一 slice 的 step：两个角色各自从 0 推进到 2</text><rect x="35" y="90" width="450" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="260.0" y="129.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">Wait 角色线程寄存器</text><text x="260.0" y="153.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">step: 0 → 2（等待/选地址）</text><rect x="555" y="90" width="450" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="780.0" y="129.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">Post 角色线程寄存器</text><text x="780.0" y="153.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">step: 0 → 2（完成后发布）</text><path d="M260 180 L260 260" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><text x="267.0" y="211.0" font-size="17" fill="#172439" text-anchor="start" font-weight="400">等待满足</text><path d="M780 180 L780 260" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><text x="787.0" y="211.0" font-size="17" fill="#172439" text-anchor="start" font-weight="400">数据/屏障/fence 完成</text><rect x="80" y="260" width="880" height="100" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="304.26" font-size="22" fill="#172439" text-anchor="middle" font-weight="400">发布的连接进度是 2</text><text x="520.0" y="330.26" font-size="22" fill="#172439" text-anchor="middle" font-weight="400">不是同一变量先 +2 再 +2 得到 4</text></svg>