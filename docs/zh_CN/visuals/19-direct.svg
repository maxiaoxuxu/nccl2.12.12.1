<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760" role="img" aria-label="Simple direct 地址交换：能力满足才使用"><title>Simple direct 地址交换：能力满足才使用</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#68758a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#172439} .title{font-size:27px;font-weight:600} .small{font-size:18px} .mono{font-family:Consolas,monospace} </style><rect width="1040" height="760" fill="#fff"/><text x="32" y="40" font-size="27" fill="#172439" text-anchor="start" font-weight="400">Simple direct 地址交换：能力满足才使用</text><rect x="305.0" y="85" width="430" height="90" rx="9" fill="#f0f4f9" stroke="#c7d1df"/><text x="520.0" y="124.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">连接能力、注册状态、原语 Direct 位共同选</text><text x="520.0" y="148.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">择</text><rect x="76.0" y="235" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="291.0" y="286.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">直接写：接收者提供 output 地址</text><rect x="534.0" y="235" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="749.0" y="286.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">直接读：发送者提供 input / output 地址</text><rect x="76.0" y="385" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="291.0" y="436.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">交换编码指针；发送者取走后清 slot</text><rect x="534.0" y="385" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="749.0" y="436.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">交换指针和预缩放标量；接收者取走</text><rect x="76.0" y="535" width="430" height="90" rx="9" fill="#eaf1ff" stroke="#c7d1df"/><text x="291.0" y="574.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">生产者直接写 output</text><text x="291.0" y="598.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">接收路径可省一次复制</text><rect x="534.0" y="535" width="430" height="90" rx="9" fill="#e8f6ee" stroke="#c7d1df"/><text x="749.0" y="574.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">消费者从映射地址拉取</text><text x="749.0" y="598.6" font-size="20" fill="#172439" text-anchor="middle" font-weight="400">仍须满足对象生命周期</text><path d="M520.0 175 L291.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M520.0 175 L749.0 235" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M291.0 325 L291.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M749.0 325 L749.0 385" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M291.0 475 L291.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/><path d="M749.0 475 L749.0 535" fill="none" stroke="#68758a" stroke-width="2" marker-end="url(#arrow)"/></svg>